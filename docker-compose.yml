services:
  mysql:
    image: mysql:8.4
    container_name: shodhai-mysql
    environment:
      MYSQL_DATABASE: shodhai
      MYSQL_USER: shodhai
      MYSQL_PASSWORD: shodhai
      MYSQL_ROOT_PASSWORD: shodhai_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: shodhai-backend
    environment:
      APP_ENV: development
      DATABASE_URL: mysql+pymysql://shodhai:shodhai@mysql:3306/shodhai
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3:8b
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      FAISS_INDEX_PATH: /app/data/faiss
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: shodhai-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data:

