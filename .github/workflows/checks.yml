name: Application checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: shodhai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo -d shodhai_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: bash scripts/build_backend_cloud.sh
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest tests -q
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
          EMBEDDING_PROVIDER: hashing
      - name: Check PostgreSQL migrations and seed
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://demo:ci-only-password@localhost:5432/shodhai_ci
        run: |
          python -m alembic upgrade head
          python -m app.database.run_seed
          python -m app.database.run_seed
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://deployment-check.example/api
